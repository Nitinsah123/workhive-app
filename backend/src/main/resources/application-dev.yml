spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:workhivedb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  data:
    redis:
      repositories:
        enabled: false

server:
  port: 8080

app:
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:3000}

logging:
  level:
    com.workhive: INFO
    org.springframework.security: INFO
