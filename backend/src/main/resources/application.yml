spring:
  application:
    name: workhive-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/workhive}
    username: ${SPRING_DATASOURCE_USERNAME:workhive}
    password: ${SPRING_DATASOURCE_PASSWORD:workhive_secret_2024}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      timeout: 5000

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS_ENABLE:true}
            required: ${SPRING_MAIL_STARTTLS_REQUIRED:true}
          ssl:
            trust: ${SPRING_MAIL_SSL_TRUST:smtp.gmail.com}
            protocols: TLSv1.2 TLSv1.3
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

app:
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:3000}

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/api/email-connections/gmail/callback}

mailhog:
  smtp:
    port: ${MAILHOG_SMTP_PORT:1025}
  http:
    port: ${MAILHOG_HTTP_PORT:8025}

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:workhive-jwt-secret-key-2024-production-grade-minimum-256-bits-long}
  expiration: ${JWT_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

# MinIO Configuration
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:workhive_minio}
  secret-key: ${MINIO_SECRET_KEY:workhive_minio_secret}
  bucket: workhive-documents

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      show-components: when_authorized
  health:
    mail:
      enabled: false
    redis:
      enabled: false

# Logging
logging:
  level:
    com.workhive: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId}] [%X{tenantId}] %-5level %logger{36} - %msg%n"
